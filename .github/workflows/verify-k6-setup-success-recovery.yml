name: Publish verified k6 setup-success recovery

on:
  pull_request:
    branches:
      - agent/verify-k6-setup-success-base

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download patch from the successful read-only verification run
        uses: actions/download-artifact@v4
        with:
          name: setup-success-recovery-patch
          path: /tmp/verified
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32243518014

      - name: Verify the exact tested patch
        run: |
          echo "90da35c1670f2ab1ab706ca708dfb16eddeb10f8ad3655e395537f5913a3f7d4  /tmp/verified/setup-success-recovery.patch" \
            | sha256sum --check --strict

      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Commit the verified patch
        run: |
          git apply --index /tmp/verified/setup-success-recovery.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: recover setup success after reconciler exit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}