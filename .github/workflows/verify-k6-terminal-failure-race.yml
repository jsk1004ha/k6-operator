name: Verify k6 terminal-failure transition

on:
  pull_request:
    branches:
      - agent/verify-k6-terminal-failure-base
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  verify:
    if: github.head_ref == 'agent/fix-k6-terminal-failure-race' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout trusted patch
        uses: actions/checkout@v4
        with:
          ref: agent/verify-k6-terminal-failure-base
          path: .trusted
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Apply trusted patch
        run: python .trusted/.github/scripts/apply-k6-terminal-failure-race.py

      - name: Format and verify
        run: |
          gofmt -w internal/controller/k6_start.go internal/controller/k6_start_test.go
          git diff --check
          ENVTEST_K8S_VERSION=1.34.1 make test
          make lint

  publish:
    needs: verify
    if: github.head_ref == 'agent/fix-k6-terminal-failure-race' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-k6-terminal-failure-race
          fetch-depth: 0

      - name: Checkout trusted patch
        uses: actions/checkout@v4
        with:
          ref: agent/verify-k6-terminal-failure-base
          path: .trusted
          persist-credentials: false

      - name: Install Go formatter
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Apply the already-verified patch
        run: |
          test "$(git rev-parse HEAD)" = "49260fc68dd1cadb27285a808f09e8dd1e9dc925"
          python .trusted/.github/scripts/apply-k6-terminal-failure-race.py
          gofmt -w internal/controller/k6_start.go internal/controller/k6_start_test.go
          git diff --check

      - name: Commit to the temporary candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/controller/k6_start.go internal/controller/k6_start_test.go
          git commit -m "fix: guard PLZ setup terminal transitions"
          git push origin HEAD:agent/fix-k6-terminal-failure-race
