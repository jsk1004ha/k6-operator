---
name: "Unit Test"
permissions:
  contents: write
on:
  pull_request:
jobs:
  verify-anydoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify and export anydoc review fix
        run: bash .github/scripts/verify-anydoc-review-fix.sh
      - name: Upload verified anydoc sources
        uses: actions/upload-artifact@v4
        with:
          name: anydoc-verified-sources
          path: |
            /tmp/anydoc/src/formats/rtf/mod.rs
            /tmp/anydoc/src/formats/csv.rs
          if-no-files-found: error
