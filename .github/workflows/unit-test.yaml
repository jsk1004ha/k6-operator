---
name: "Unit Test"
permissions:
  contents: write
on:
  pull_request:
jobs:
  verify-anydoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Clone anydoc PR branch
        run: |
          git clone --depth 1 --branch fix/bound-csv-rtf-materialization \
            https://github.com/jsk1004ha/anydoc.git /tmp/anydoc

      - name: Apply all unresolved review fixes
        run: |
          cd /tmp/anydoc
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{path}: expected exactly one old match")
                  path.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f"{path}: neither old nor fixed form was found")

          csv = Path("src/formats/csv.rs")
          replace_once(
              csv,
              "        let mut cells = Vec::with_capacity(record.len());",
              "        let mut cells = Vec::new();",
          )

          rtf = Path("src/formats/rtf/mod.rs")
          replace_once(
              rtf,
              """    fn end_paragraph(&mut self) -> Result<(), ConvertError> {
        let inlines = std::mem::take(&mut self.inlines);""",
              """    fn end_paragraph(&mut self) -> Result<(), ConvertError> {
        if let Some(error) = self.materialization_error.take() {
            return Err(error);
        }
        let inlines = std::mem::take(&mut self.inlines);""",
          )
          replace_once(
              rtf,
              """        if let Some((key, level, number, label)) = entry {
            self.list_run.push(ListEntry {""",
              """        if let Some((key, level, number, label)) = entry {
            if key.marker.ordered()
                && let Some(label) = label.as_ref()
            {
                self.budget.charge_text(label.len())?;
                self.budget.charge_text_run()?;
            }
            self.list_run.push(ListEntry {""",
          )
          replace_once(
              rtf,
              """    fn end_cell(&mut self, depth: usize) -> Result<(), ConvertError> {
        self.budget.charge_cell()?;""",
              """    fn end_cell(&mut self, depth: usize) -> Result<(), ConvertError> {
        if let Some(error) = self.materialization_error.take() {
            return Err(error);
        }
        self.budget.charge_cell()?;""",
          )
          replace_once(
              rtf,
              """    #[test]
    fn rtf_cell_materialization_is_bounded() {
        let budget = MaterializationBudget::with_limits(1024, 1024, 1, 10);
        let error =
            parse_with_budget(br"{\\rtf1\\trowd\\cellx1000\\cellx2000 a\\cell b\\cell\\row}", budget)
                .unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_cells");
    }
}""",
              """    #[test]
    fn rtf_cell_materialization_is_bounded() {
        let budget = MaterializationBudget::with_limits(1024, 1024, 1, 10);
        let error =
            parse_with_budget(br"{\\rtf1\\trowd\\cellx1000\\cellx2000 a\\cell b\\cell\\row}", budget)
                .unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_cells");
    }

    #[test]
    fn rtf_generated_list_labels_are_bounded() {
        let budget = MaterializationBudget::with_limits(4096, 4, 10, 10);
        let error = parse_with_budget(
            br"{\\rtf1{\\*\\listtable{\\list{\\listlevel\\levelnfc0\\levelstartat1{\\leveltext \\'03\\'00.\\'00;}{\\levelnumbers \\'01\\'03;}}\\listid1}}{\\listoverridetable{\\listoverride\\listid1\\listoverridecount0\\ls1}}\\pard\\ls1\\ilvl0 item\\par}",
            budget,
        )
        .unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_text_bytes");
    }

    #[test]
    fn pending_text_limit_precedes_cell_limit() {
        let budget = MaterializationBudget::with_limits(1024, 1, 0, 10);
        let error =
            parse_with_budget(br"{\\rtf1\\trowd\\cellx1000 ab\\cell\\row}", budget).unwrap_err();
        assert_eq!(rtf_resource_limit_name(error), "max_materialized_text_bytes");
    }
}""",
          )
          PY

      - name: Format and verify Rust workspace
        working-directory: /tmp/anydoc
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Export verified RTF source in deterministic chunks
        run: |
          base64 -w0 /tmp/anydoc/src/formats/rtf/mod.rs > /tmp/rtf-mod.rs.b64
          rm -rf .agent-output
          mkdir -p .agent-output
          split -b 3000 -d -a 3 --additional-suffix=.part \
            /tmp/rtf-mod.rs.b64 .agent-output/rtf-
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('/tmp/anydoc/src/formats/rtf/mod.rs').read_bytes()
          chunks = sorted(p.name for p in Path('.agent-output').glob('rtf-*.part'))
          Path('.agent-output/manifest.json').write_text(json.dumps({
              'sha256': hashlib.sha256(source).hexdigest(),
              'bytes': len(source),
              'chunks': chunks,
          }, indent=2) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan agent/anydoc-generated-output
          git rm -rf .
          git add .agent-output
          git commit -m "test: export verified anydoc RTF source"
          git push --force origin HEAD:agent/anydoc-generated-output
