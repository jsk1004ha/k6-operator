name: Verify k6 setup claim recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'agent/verify-k6-claim-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-k6-claim-recovery
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Format and verify
        run: |
          gofmt -w internal/controller/k6_start.go internal/controller/k6_start_test.go
          git diff --check
          make test
          make lint
        env:
          ENVTEST_K8S_VERSION: 1.34.1

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/controller/k6_start.go internal/controller/k6_start_test.go
          git commit -m 'style: format PLZ setup recovery changes'
          git push origin HEAD:agent/verify-k6-claim-recovery
